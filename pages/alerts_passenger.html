<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Alertas | Movanza Pasajeros</title>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/company_design_system.css"/>
  <link rel="stylesheet" href="../css/home.css"/>
  <style>
    body.company-theme, .company-content, .company-shell { background-color: #0d0d0f !important; color: #ffffff !important; }
    .card, .table-wrap, table { background-color: #161618 !important; color: #ffffff !important; border-color: rgba(255,255,255,0.08) !important; }
    table td, table th, .route-empty { background-color: #161618 !important; color: #ffffff !important; border-bottom: 1px solid rgba(255,255,255,0.05) !important; }
  </style>
</head>
<body class="company-theme company-dashboard">

  <div class="company-shell">
    <aside class="company-sidebar">
      <div class="company-sidebar-brand">
        <a class="company-logo-link" href="home_passenger.html"><img class="company-logo-img" src="https://ruunbwmuizhaetgubzjt.supabase.co/storage/v1/object/public/MOVANZA/Logo%20MOVANZA.png" alt="MOVANZA"/></a>
      </div>
      <nav class="company-nav-list">
        <p class="label-caps company-nav-label">Mi Movilidad</p>
        <a class="company-nav-item" href="home_passenger.html">
          <span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Inicio
        </a>
        <a class="company-nav-item" href="view_routes.html">
          <span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3ZM9 3v15M15 6v15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Rutas y Mapas
        </a>
        <a class="company-nav-item is-active" href="alerts_passenger.html">
          <span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Alertas de Red
        </a>
        <a class="company-nav-item" href="denuncias.html">
          <span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>PQRS / Denuncias
        </a>
      </nav>
    </aside>

    <div class="company-content">
      <header class="nav company-topbar">
        <div class="nav-inner company-topbar-inner">
          <div class="nav-left company-header-identity">
            <a class="company-logo-link" href="home_passenger.html"><img src="https://ruunbwmuizhaetgubzjt.supabase.co/storage/v1/object/public/MOVANZA/Logo%20MOVANZA.png" alt="MOVANZA"/></a>
          </div>
          <div class="company-header-pattern" aria-hidden="true"></div>
          <div class="nav-right company-user-actions">
            <span class="company-user-chip" id="who">...</span>
            <button class="company-logout-btn" id="logout">Salir</button>
          </div>
        </div>
      </header>

      <main class="container home-wrap company-main" style="max-width: 1000px;">
        <section class="card welcome company-overview" style="margin-bottom: 16px;">
          <div class="welcome-top">
            <div>
              <p class="label-caps">Centro de Avisos</p>
              <h1>Alertas Operativas</h1>
              <p style="color: #a1a1aa;">Mantente informado sobre cierres, novedades y cambios en el sistema.</p>
            </div>
          </div>
        </section>

        <section class="card" style="padding: 20px;">
          <div class="panel-heading"><h2>Avisos y Comunicados Oficiales</h2></div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Detalle de la Alerta</th>
                  <th>Nivel</th>
                </tr>
              </thead>
              <tbody id="alertsTable">
                <tr><td colspan="3" class="route-empty" style="color: #a1a1aa;">Buscando alertas activas...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module">
    import { requireAuthAndRole } from "../js/guard.js";
    import { signOut } from "../js/auth.js";
    import { supabase } from "../js/supabaseClient.js";

    const profile = await requireAuthAndRole(1);
    if (profile) document.getElementById("who").textContent = `@${profile.username}`;
    document.getElementById("logout").addEventListener("click", async () => { await signOut(); window.location.href = "login.html"; });

    async function loadAlerts() {
      const tbody = document.getElementById("alertsTable");
      try {
        const { data, error } = await supabase.from("alerts").select("*").order("created_at", { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" class="route-empty">La red opera con normalidad. No hay alertas.</td></tr>`;
          return;
        }
        tbody.innerHTML = data.map(a => `
          <tr>
            <td style="font-size: 12px; color: #a1a1aa; white-space: nowrap;">${new Date(a.created_at).toLocaleDateString()}</td>
            <td><strong style="color:#fff;">${a.title}</strong><br/><span style="font-size: 12px; color: #a1a1aa;">${a.message || ''}</span></td>
            <td><span class="pill" style="font-size:11px;">${a.type || 'INFO'}</span></td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="route-empty">Error al cargar comunicados.</td></tr>`;
      }
    }
    loadAlerts();
  </script>
</body>
</html>
