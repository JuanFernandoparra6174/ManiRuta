<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Monitoreo de Viaje | Movanza</title>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/company_design_system.css"/>
  <link rel="stylesheet" href="../css/home.css"/>
  <!-- Leaflet CSS para el mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="company-theme company-dashboard">

  <div class="company-content" style="width: 100%; min-height: 100vh;">
    <!-- Barra superior unificada con Movanza -->
    <header class="nav company-topbar">
      <div class="nav-inner company-topbar-inner">
        <div class="nav-left company-header-identity">
          <a class="company-header-logo" href="home_driver.html" aria-label="MOVANZA inicio">
            <img src="https://ruunbwmuizhaetgubzjt.supabase.co/storage/v1/object/public/MOVANZA/Logo%20MOVANZA.png" alt="MOVANZA"/>
          </a>
        </div>

        <div class="company-header-pattern" aria-hidden="true"></div>

        <div class="nav-right company-user-actions">
          <span class="company-user-chip" id="who">...</span>
          <button class="company-logout-btn" id="logout">Salir</button>
        </div>
      </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container home-wrap company-main" style="max-width: 1100px;">
      
      <!-- Encabezado del Viaje -->
      <section class="card welcome company-overview" style="margin-bottom: 16px;">
        <div class="welcome-top">
          <div>
            <p class="label-caps">Monitoreo GPS en Vivo</p>
            <h1 id="tripTitle">Cargando trayecto...</h1>
            <div id="tripMeta" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;">
              <!-- Los badges de info se inyectan dinámicamente aquí -->
            </div>
          </div>
          <a href="driver_trips.html" class="btn-mini secondary" style="display:inline-flex; align-items:center;">← Volver a viajes</a>
        </div>
      </section>

      <!-- Mensajes de Estado / Alertas -->
      <div id="ok" class="toast-ok" style="display: none; margin-bottom: 16px;"></div>
      <div id="err" class="toast-err" style="display: none; margin-bottom: 16px;"></div>

      <!-- Tarjeta del Mapa y Controles de Tracking -->
      <section class="card" style="padding: 20px;">
        <div id="driverMap" style="height: 480px; width: 100%; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);"></div>
        
        <div style="display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;">
          <button id="startTracking" class="btn" style="background: #00ff66; color: #050505; font-weight: 900; box-shadow: 0 0 15px rgba(0,255,102,0.3);">
            ▶ Iniciar seguimiento GPS
          </button>
          <button id="stopTracking" class="btn" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #ffb4b4; font-weight: 900;">
            ⏹ Detener seguimiento
          </button>
        </div>
      </section>

    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Script de lógica original de tracking -->
  <script type="module" src="../js/driver_trip_live_page.js"></script>

</body>
</html>
