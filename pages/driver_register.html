<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>

  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/company_design_system.css"/>
  <link rel="stylesheet" href="../css/home.css"/>

<div class="company-shell">
  <aside class="company-sidebar" aria-label="Navegacion Empresa">

        <img class="company-logo-img" src="https://ruunbwmuizhaetgubzjt.supabase.co/storage/v1/object/public/MOVANZA/Logo%20MOVANZA.png" alt="MOVANZA"/>
      </a>
    </div>

    <nav class="company-nav-list">
      <p class="label-caps company-nav-label">Empresa</p>
      <a class="company-nav-item" href="home_company.html"><span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Inicio</a>
      <a class="company-nav-item" href="buses.html"><span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 19v2M18 19v2M5 11h14M6 4h12a2 2 0 0 1 2 2v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Mi Flota</a>
      <a class="company-nav-item is-active" href="drivers.html" aria-current="page"><span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Conductores</a>
      <a class="company-nav-item" href="company_routes.html"><span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3ZM9 3v15M15 6v15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Rutas</a>
      <a class="company-nav-item" href="company_trips.html"><span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM18 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM6 13V9a4 4 0 0 1 4-4h5M18 11v4a4 4 0 0 1-4 4H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Viajes</a>
      <a class="company-nav-item" href="company_stats.html"><span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3v18h18M7 15l4-4 3 3 5-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Estadisticas</a>
    </nav>

    <div class="company-sidebar-footer">
      <a class="company-nav-item" href="company_settings.html"><span class="company-nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a7.9 7.9 0 0 0 .1-2l2-1.2-2-3.4-2.3.7a7.4 7.4 0 0 0-1.7-1l-.3-2.4H10.8l-.3 2.4a7.4 7.4 0 0 0-1.7 1l-2.3-.7-2 3.4 2 1.2a7.9 7.9 0 0 0 .1 2l-2 1.2 2 3.4 2.3-.7c.5.4 1.1.7 1.7 1l.3 2.4h4.4l.3-2.4c.6-.3 1.2-.6 1.7-1l2.3.7 2-3.4-2-1.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Ajustes</a>
    </div>
  </aside>

  <div class="company-content">
    <header class="nav company-topbar">
      <div class="nav-inner company-topbar-inner">
        <div class="nav-left company-header-identity">
          <button class="icon-btn" id="menuBtn" title="Menu" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <a class="company-header-logo" href="home_company.html" aria-label="MOVANZA inicio"><img src="https://ruunbwmuizhaetgubzjt.supabase.co/storage/v1/object/public/MOVANZA/Logo%20MOVANZA.png" alt="MOVANZA"/></a>
        </div>
        <div class="company-header-pattern" aria-hidden="true"></div>
        <div class="nav-right company-user-actions">
          <span class="company-user-chip" id="who">...</span>
          <button class="company-logout-btn" id="logout">Salir</button>
        </div>
      </div>
    </header>

    <main class="container drivers-page company-main drivers-register-page">
      <a class="back-link" href="drivers.html">Volver a conductores</a>

      <section class="card panel driver-form-panel">
        <div class="panel-title">
          <div>
            <p class="label-caps">Conductores</p>
            <h3 id="formTitle">Registrar conductor</h3>
          </div>
          <span class="mini-muted" id="formHint">Crea el perfil operativo y su acceso de inicio de sesion.</span>
        </div>

        <form id="driverForm" class="grid1">
          <input type="hidden" id="driverId"/>

          <div>
            <label class="mini-muted">Nombre completo *</label>
            <input class="input" id="fullName" placeholder="Ej: Juan Perez" required maxlength="80"/>
          </div>

          <div class="grid2">
            <div>
              <label class="mini-muted">Tipo documento *</label>
              <select class="input" id="docType" required>
                <option value="CC">CC</option>
                <option value="CE">CE</option>
                <option value="PASSPORT">Pasaporte</option>
              </select>
            </div>
            <div>
              <label class="mini-muted">Numero documento *</label>
              <input class="input" id="docNumber" placeholder="Ej: 123456789" required maxlength="30"/>
            </div>
          </div>

          <div class="grid2">
            <div>
              <label class="mini-muted">Telefono</label>
              <input class="input" id="phone" placeholder="+57 3xx xxx xxxx" maxlength="30"/>
            </div>
            <div>
              <label class="mini-muted">Licencia *</label>
              <input class="input" id="licenseNo" placeholder="Ej: LIC-998877" required maxlength="40"/>
            </div>
          </div>

          <div class="grid2 credential-fields">
            <div>
              <label class="mini-muted">Usuario de acceso *</label>
              <input class="input" id="username" placeholder="Ej: juan.conductor" maxlength="50"/>
            </div>
            <div>
              <label class="mini-muted">Correo de acceso *</label>
              <input class="input" id="email" type="email" placeholder="conductor@empresa.com"/>
            </div>
          </div>

          <div class="credential-fields">
            <label class="mini-muted">Contrasena temporal *</label>
            <input class="input" id="password" type="password" minlength="8" placeholder="Minimo 8 caracteres"/>
          </div>

          <div>
            <label class="mini-muted">Estado *</label>
            <select class="input" id="status" required>
              <option value="ACTIVE">Activo</option>
              <option value="INACTIVE">Inactivo</option>
            </select>
          </div>

          <div class="actions-row">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <button class="btn-soft" type="button" id="cancelEditBtn" style="display:none;">Cancelar edicion</button>
            <button class="btn-soft btn-danger" type="button" id="clearBtn">Limpiar</button>
          </div>

          <div class="toast-ok" id="ok"></div>
          <div class="toast-err" id="err"></div>
        </form>
      </section>
    </main>
  </div>
</div>

<script type="module">
  import { requireAuthAndRole } from "../js/guard.js";
  import { signOut } from "../js/auth.js";
  import { setError, setOk, setText } from "../js/ui.js";
  import {
    fetchCompanyDrivers,
    createDriverWithAccount,
    updateDriver
  } from "../js/drivers.js";

  const profile = await requireAuthAndRole(2);
  if (!profile) throw new Error("No auth");
  setText("who", `@${profile.username}`);

  const companyId = profile.company_id;
  const editId = new URLSearchParams(window.location.search).get("edit");

  const form = document.getElementById("driverForm");
  const driverIdEl = document.getElementById("driverId");
  const fullNameEl = document.getElementById("fullName");
  const docTypeEl = document.getElementById("docType");
  const docNumberEl = document.getElementById("docNumber");
  const phoneEl = document.getElementById("phone");
  const licenseEl = document.getElementById("licenseNo");
  const usernameEl = document.getElementById("username");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const statusEl = document.getElementById("status");
  const formTitle = document.getElementById("formTitle");
  const formHint = document.getElementById("formHint");
  const cancelEditBtn = document.getElementById("cancelEditBtn");
  const clearBtn = document.getElementById("clearBtn");

  function toggleCredentialFields(disabled) {
    usernameEl.disabled = disabled;
    emailEl.disabled = disabled;
    passwordEl.disabled = disabled;
  }

  function clearForm(){
    driverIdEl.value = "";
    fullNameEl.value = "";
    docTypeEl.value = "CC";
    docNumberEl.value = "";
    phoneEl.value = "";
    licenseEl.value = "";
    usernameEl.value = "";
    emailEl.value = "";
    passwordEl.value = "";
    statusEl.value = "ACTIVE";
    toggleCredentialFields(false);
    formTitle.textContent = "Registrar conductor";
    formHint.textContent = "Crea el perfil operativo y su acceso de inicio de sesion.";
    cancelEditBtn.style.display = "none";
  }

  function setEditMode(driver){
    driverIdEl.value = driver.id;
    fullNameEl.value = driver.full_name || "";
    docTypeEl.value = driver.doc_type || "CC";
    docNumberEl.value = driver.doc_number || "";
    phoneEl.value = driver.phone || "";
    licenseEl.value = driver.license_no || "";
    usernameEl.value = "";
    emailEl.value = "";
    passwordEl.value = "";
    statusEl.value = driver.status || "ACTIVE";
    toggleCredentialFields(true);
    formTitle.textContent = "Editar conductor";
    formHint.textContent = "Los datos de acceso se crean al registrar y no se editan desde esta pantalla.";
    cancelEditBtn.style.display = "inline-flex";
  }

  if (!companyId) {
    for (const element of [fullNameEl, docTypeEl, docNumberEl, phoneEl, licenseEl, usernameEl, emailEl, passwordEl, statusEl]) {
      element.disabled = true;
    }
    form.querySelector("button[type='submit']").disabled = true;
    setError("err", "Tu usuario empresa no tiene una empresa asignada. No es posible guardar conductores.");
  }

  if (companyId && editId) {
    const drivers = await fetchCompanyDrivers(companyId);
    const driver = drivers.find((item) => item.id === editId);
    if (driver) setEditMode(driver);
  }

  document.getElementById("logout").addEventListener("click", async () => {
    await signOut();
    window.location.href = "login.html";
  });

  cancelEditBtn.addEventListener("click", () => {
    window.location.href = "drivers.html";
  });

  clearBtn.addEventListener("click", () => {
    clearForm();
    setOk("ok", "Campos limpios.");
    setError("err", "");
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    try {
      setError("err", "");
      setOk("ok", "");
      if (!companyId) return;

      const id = driverIdEl.value;
      const full_name = fullNameEl.value.trim();
      const doc_type = docTypeEl.value.trim();
      const doc_number = docNumberEl.value.trim();
      const phone = phoneEl.value.trim();
      const license_no = licenseEl.value.trim();
      const username = usernameEl.value.trim();
      const email = emailEl.value.trim().toLowerCase();
      const password = passwordEl.value;
      const status = statusEl.value;

      if (!full_name) return setError("err", "Nombre obligatorio.");
      if (!doc_number) return setError("err", "Numero de documento obligatorio.");
      if (!license_no) return setError("err", "Licencia obligatoria.");

      if (!id) {
        if (!username) return setError("err", "Usuario de acceso obligatorio.");
        if (!email) return setError("err", "Correo de acceso obligatorio.");
        if (password.length < 8) return setError("err", "La contrasena temporal debe tener minimo 8 caracteres.");

        const created = await createDriverWithAccount({
          company_id: companyId,
          username,
          email,
          password,
          full_name,
          doc_type,
          doc_number,
          phone,
          license_no,
          status
        });
        setOk("ok", `Conductor creado. Acceso listo para ${created.email}.`);
        alert(`Conductor creado correctamente.\n\nUsuario: ${created.username}\nCorreo: ${created.email}\n\nComparte la contrasena temporal registrada en el formulario con el conductor.`);
      } else {
        await updateDriver(id, companyId, {
          full_name,
          doc_type,
          doc_number,
          phone: phone || null,
          license_no,
          status
        });
        setOk("ok", "Conductor actualizado.");
      }

      window.location.href = "drivers.html";
    } catch (error) {
      console.error(error);
      const msg = (error?.message || String(error)).toLowerCase();
      if (msg.includes("duplicate") || msg.includes("unique")) {
        setError("err", "Ya existe un conductor o acceso con esos datos.");
      } else {
        setError("err", error?.message || String(error));
      }
    }
  });
</script>

</body>
</html>
