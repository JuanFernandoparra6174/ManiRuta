<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Historial de Viajes | Movanza</title>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/company_design_system.css"/>
  <link rel="stylesheet" href="../css/home.css"/>
</head>
<body class="company-theme company-dashboard">

  <div class="company-content" style="width: 100%; min-height: 100vh;">
    <header class="nav company-topbar">
      <div class="nav-inner company-topbar-inner">
        <div class="nav-left company-header-identity">
          <a class="company-header-logo" href="home_driver.html" aria-label="MOVANZA inicio">
            <img src="https://ruunbwmuizhaetgubzjt.supabase.co/storage/v1/object/public/MOVANZA/Logo%20MOVANZA.png" alt="MOVANZA"/>
          </a>
        </div>

        <div class="company-header-pattern" aria-hidden="true"></div>

        <div class="nav-right company-user-actions">
          <span class="company-user-chip" id="who">...</span>
          <button class="company-logout-btn" id="logout">Salir</button>
        </div>
      </div>
    </header>

    <main class="container home-wrap company-main" style="max-width: 900px;">
      <section class="card welcome company-overview" style="margin-bottom: 16px;">
        <div class="welcome-top">
          <div>
            <p class="label-caps">Registro Histórico</p>
            <h1>Historial de Jornadas</h1>
            <p>Consulta el archivo de todos los viajes completados o cancelados.</p>
          </div>
          <a href="home_driver.html" class="btn-mini secondary" style="display:inline-flex; align-items:center;">← Volver al inicio</a>
        </div>
      </section>

      <section class="card" style="padding: 20px;">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Ruta</th>
                <th>Bus</th>
                <th>Inicio</th>
                <th>Finalización</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td colspan="5" class="route-empty">Cargando historial...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="../js/driver_history_page.js"></script>
</body>
</html>
